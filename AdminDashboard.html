<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Applications - Field Trip Application</title>

    <!-- Bootstrap 5 CSS, vendored locally (no external CDN request) -->
    <?!= include('VendorStyles'); ?>

    <style>
        body {
            background: #4a5568;
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .dashboard-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #000068 0%, #0d47a1 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .dashboard-body {
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-container">
            <div class="dashboard-header">
                <h1>Pending Applications</h1>
                <p class="mb-0">Field Trip Application</p>
            </div>

            <div class="dashboard-body">
                <div id="alertArea"></div>

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                    <div>
                        <label class="form-label mb-0 me-2" for="buildingFilter">Building</label>
                        <select class="form-select d-inline-block w-auto" id="buildingFilter">
                            <option value="">All Buildings</option>
                            <option value="HS">HS</option>
                            <option value="MS">MS</option>
                            <option value="IS">IS</option>
                            <option value="FL">FL</option>
                            <option value="ECC">ECC</option>
                        </select>
                    </div>
                    <div class="text-muted" id="countLabel"></div>
                </div>

                <div id="resultsArea">
                    <p class="text-muted">Loading pending applications...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        var allSubmissions = [];

        function statusBadgeClass(status) {
            if (status === 'Pending District Approval') return 'text-bg-info';
            return 'text-bg-warning';
        }

        function reviewLink(submission) {
            var stage = submission.status === 'Pending District Approval' ? 2 : 1;
            return '?idNum=' + encodeURIComponent(submission.submission_number) + '&buildapprove=' + stage;
        }

        function render() {
            var building = document.getElementById('buildingFilter').value;
            var filtered = building
                ? allSubmissions.filter(function (s) { return s.building === building; })
                : allSubmissions;

            document.getElementById('countLabel').textContent =
                filtered.length + (filtered.length === 1 ? ' application' : ' applications');

            var area = document.getElementById('resultsArea');
            area.innerHTML = '';

            if (filtered.length === 0) {
                var none = document.createElement('p');
                none.className = 'text-muted';
                none.textContent = 'No pending applications.';
                area.appendChild(none);
                return;
            }

            var table = document.createElement('table');
            table.className = 'table table-hover align-middle';
            table.innerHTML = '<thead><tr><th>#</th><th>Building</th><th>Destination</th><th>Trip Date</th>' +
                '<th>Adult in Charge</th><th>Status</th><th></th></tr></thead>';

            var tbody = document.createElement('tbody');
            filtered.forEach(function (s) {
                var tr = document.createElement('tr');

                [s.submission_number, s.building, s.destination, s.trip_date, s.adult_in_charge].forEach(function (val) {
                    var td = document.createElement('td');
                    td.textContent = val || '-';
                    tr.appendChild(td);
                });

                var statusTd = document.createElement('td');
                var badge = document.createElement('span');
                badge.className = 'badge ' + statusBadgeClass(s.status);
                badge.textContent = s.status || '-';
                statusTd.appendChild(badge);
                tr.appendChild(statusTd);

                var actionTd = document.createElement('td');
                var link = document.createElement('a');
                link.href = reviewLink(s);
                link.className = 'btn btn-sm btn-outline-primary';
                link.textContent = 'Review';
                actionTd.appendChild(link);
                tr.appendChild(actionTd);

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            area.appendChild(table);
        }

        document.getElementById('buildingFilter').addEventListener('change', render);

        google.script.run
            .withSuccessHandler(function (result) {
                if (!result.success) {
                    document.getElementById('resultsArea').innerHTML =
                        '<div class="alert alert-danger">' + (result.message || 'Unable to load pending applications.') + '</div>';
                    return;
                }
                allSubmissions = result.submissions;
                render();
            })
            .withFailureHandler(function () {
                document.getElementById('resultsArea').innerHTML =
                    '<div class="alert alert-danger">Something went wrong loading pending applications.</div>';
            })
            .getPendingSubmissions();
    </script>
</body>
</html>
