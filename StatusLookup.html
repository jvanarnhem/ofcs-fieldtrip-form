<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Application Status - Field Trip Application</title>

    <!-- Bootstrap 5 CSS, vendored locally (no external CDN request) -->
    <?!= include('VendorStyles'); ?>

    <style>
        body {
            background: #4a5568;
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .lookup-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .lookup-header {
            background: linear-gradient(135deg, #000068 0%, #0d47a1 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .open-form-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .open-form-btn:hover {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }

        .lookup-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .lookup-body {
            padding: 40px;
        }

        #resultsArea table {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="lookup-container">
            <div class="lookup-header">
                <a href="<?!= webAppUrl ?>" target="_blank" rel="noopener" class="open-form-btn">Open Form ↗</a>
                <h1>Check Application Status</h1>
                <p class="mb-0">Field Trip Application</p>
            </div>

            <div class="lookup-body">
                <div id="alertArea"></div>

                <form id="lookupForm">
                    <label class="form-label" for="email">Email address used on the application</label>
                    <div class="input-group mb-3">
                        <input type="email" class="form-control" id="email" required placeholder="you@ofcs.net">
                        <button class="btn btn-submit" type="submit" id="lookupBtn">Check Status</button>
                    </div>
                </form>

                <div id="resultsArea"></div>
            </div>
        </div>
    </div>

    <!-- Only Bootstrap JS feature used on this page is alert dismissal, so a full bundle isn't vendored -->
    <script>
        document.addEventListener('click', function (e) {
            var dismissBtn = e.target.closest('[data-bs-dismiss="alert"]');
            if (dismissBtn) {
                var alertEl = dismissBtn.closest('.alert');
                if (alertEl) alertEl.remove();
            }
        });

        document.getElementById('lookupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('lookupBtn');
            btn.disabled = true;
            btn.textContent = 'Searching...';

            google.script.run
                .withSuccessHandler(function (rawResult) {
                    btn.disabled = false;
                    btn.textContent = 'Check Status';
                    try {
                        var result = JSON.parse(rawResult);
                        console.log('getMySubmissions result:', result);
                        renderResults(result);
                    } catch (renderError) {
                        console.error('renderResults error:', renderError, rawResult);
                        showAlert('Something went wrong displaying your results. Please try again.', 'danger');
                    }
                })
                .withFailureHandler(function (error) {
                    btn.disabled = false;
                    btn.textContent = 'Check Status';
                    console.error('getMySubmissions failed:', error);
                    showAlert('Something went wrong looking up your applications. Please try again.', 'danger');
                })
                .getMySubmissions(email);
        });

        function statusBadgeClass(status) {
            if (status === 'Approved') return 'text-bg-success';
            if (status === 'Rejected') return 'text-bg-danger';
            if (status === 'Pending District Approval') return 'text-bg-info';
            return 'text-bg-warning';
        }

        function renderResults(result) {
            var area = document.getElementById('resultsArea');
            area.innerHTML = '';

            if (!result || !result.success) {
                showAlert((result && result.message) || 'Unable to look up applications.', 'danger');
                return;
            }

            var submissions = result.submissions || [];

            if (submissions.length === 0) {
                var none = document.createElement('p');
                none.className = 'text-muted mt-3';
                none.textContent = 'No applications found for that email address.';
                area.appendChild(none);
                return;
            }

            var table = document.createElement('table');
            table.className = 'table table-hover';
            table.innerHTML = '<thead><tr><th>#</th><th>Destination</th><th>Trip Date</th><th>Status</th></tr></thead>';

            var tbody = document.createElement('tbody');
            submissions.forEach(function (s) {
                var tr = document.createElement('tr');

                var tdNum = document.createElement('td');
                tdNum.textContent = s.submission_number || '-';
                tr.appendChild(tdNum);

                var tdDest = document.createElement('td');
                tdDest.textContent = s.destination || '-';
                tr.appendChild(tdDest);

                var tdDate = document.createElement('td');
                tdDate.textContent = s.trip_date ? new Date(s.trip_date).toLocaleDateString() : '-';
                tr.appendChild(tdDate);

                var tdStatus = document.createElement('td');
                var badge = document.createElement('span');
                badge.className = 'badge ' + statusBadgeClass(s.status);
                badge.textContent = s.status || '-';
                tdStatus.appendChild(badge);
                tr.appendChild(tdStatus);

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            area.appendChild(table);
        }

        function showAlert(message, type) {
            var div = document.createElement('div');
            div.className = 'alert alert-' + type + ' alert-dismissible fade show';
            div.setAttribute('role', 'alert');
            div.textContent = message;

            var closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'btn-close';
            closeBtn.setAttribute('data-bs-dismiss', 'alert');
            div.appendChild(closeBtn);

            var area = document.getElementById('alertArea');
            area.innerHTML = '';
            area.appendChild(div);
        }
    </script>
</body>
</html>
