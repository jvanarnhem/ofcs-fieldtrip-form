<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OFCS Field Trip Application</title>

    <!-- Bootstrap 5 CSS, vendored locally (no external CDN request) -->
    <?!= include('VendorStyles'); ?>

    <style>
        :root {
            --ofcs-primary: #0d6efd;
            --ofcs-secondary: #6c757d;
            --ofcs-success: #198754;
            --ofcs-danger: #dc3545;
            --ofcs-warning: #ffc107;
        }

        body {
            background: #e8e8e8;
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 0;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #000068 0%, #0d47a1 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            margin: 0;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-header p {
            margin: 15px 0 0 0;
            opacity: 0.95;
            font-size: 2.2rem;
            font-weight: 500;
        }

        .form-body {
            padding: 40px;
        }

        .section-header {
            border-bottom: 3px solid #000068;
            padding-bottom: 10px;
            margin-bottom: 25px;
            margin-top: 30px;
        }

        .section-header:first-child {
            margin-top: 0;
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: #000068;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .required-indicator {
            color: var(--ofcs-danger);
            font-weight: bold;
        }

        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #000068;
            box-shadow: 0 0 0 0.25rem rgba(0, 0, 104, 0.25);
        }

        .invalid-feedback {
            display: block;
            font-size: 0.875rem;
            margin-top: 5px;
        }

        .is-invalid {
            border-color: var(--ofcs-danger);
        }

        .is-valid {
            border-color: var(--ofcs-success);
        }

        .btn-submit {
            background: linear-gradient(135deg, #000068 0%, #0d47a1 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 104, 0.4);
            color: white;
        }

        .btn-draft {
            background: white;
            border: 2px solid #000068;
            color: #000068;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-draft:hover {
            background: #000068;
            color: white;
        }

        .help-text {
            font-size: 0.875rem;
            color: #6c757d;
            margin-top: 5px;
        }

        .alert {
            border-radius: 8px;
            border: none;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .conditional-field {
            display: none;
        }

        .form-footer {
            background: #f8f9fa;
            padding: 30px 40px;
            border-top: 1px solid #dee2e6;
        }

        /* Tablet and smaller */
        @media (max-width: 992px) {
            .form-header h1 {
                font-size: 2.4rem;
            }

            .form-header p {
                font-size: 1.8rem;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .form-body {
                padding: 20px;
            }

            .form-header {
                padding: 20px;
            }

            .form-header h1 {
                font-size: 1.8rem;
                letter-spacing: 0.3px;
            }

            .form-header p {
                font-size: 1.3rem;
                margin: 10px 0 0 0;
            }

            .btn-submit, .btn-draft {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        /* Small mobile */
        @media (max-width: 480px) {
            .form-header h1 {
                font-size: 1.5rem;
            }

            .form-header p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

            const SECTION_ICONS = {

            const TRANSPORTATION_NOTE_HTML = `<div class="alert alert-info">${ICON_INFO}

            function slug(value) {
                return String(value).toLowerCase().replace(/[^a-z0-9]+/g, '_');
            }

            function renderField(key, field) {
                const required = !!field.required;
                const reqMark = required
                    ? ' <span class="required-indicator">*</span>'
                    : ' <span class="text-muted">(Optional)</span>';

                let controlHtml;

                if (field.type === 'select') {
                    const opts = field.options.map(function(opt) {
                        const label = (field.optionLabels && field.optionLabels[opt]) || opt;
                        return `<option value="${opt}">${label}</option>`;
                    }).join('');
                    controlHtml = `<select class="form-select" id="${key}" name="${key}" ${required ? 'required' : ''}>
                        <option value="">Select ${field.label}...</option>${opts}
                    </select>`;

                } else if (field.type === 'textarea') {
                    const attrs = [`id="${key}"`, `name="${key}"`, 'rows="3"'];
                    if (required) attrs.push('required');
                    if (field.maxLength) attrs.push(`maxlength="${field.maxLength}"`);
                    if (field.placeholder) attrs.push(`placeholder="${field.placeholder}"`);
                    controlHtml = `<textarea class="form-control" ${attrs.join(' ')}></textarea>`;

                } else if (field.type === 'radio') {
                    const radios = field.options.map(function(opt) {
                        const id = key + '_' + slug(opt);
                        return `<div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="${key}" id="${id}" value="${opt}" ${required ? 'required' : ''}>
                            <label class="form-check-label" for="${id}">${opt}</label>
                        </div>`;
                    }).join('');
                    controlHtml = `<div>${radios}</div>`;

                } else if (field.type === 'checkbox') {
                    controlHtml = `<div class="form-check">
                        <input class="form-check-input" type="checkbox" id="${key}" name="${key}" value="Yes">
                        <label class="form-check-label" for="${key}">${field.label}</label>
                    </div>`;

                } else {
                    const attrs = [`type="${field.type}"`, `id="${key}"`, `name="${key}"`];
                    if (required) attrs.push('required');
                    if (field.maxLength) attrs.push(`maxlength="${field.maxLength}"`);
                    if (field.min !== undefined) attrs.push(`min="${field.min}"`);
                    if (field.max !== undefined) attrs.push(`max="${field.max}"`);
                    if (field.defaultValue !== undefined) attrs.push(`value="${field.defaultValue}"`);
                    if (field.placeholder) attrs.push(`placeholder="${field.placeholder}"`);
                    controlHtml = `<input class="form-control" ${attrs.join(' ')}>`;
                }

                if (field.directionsButton) {
                    controlHtml = `<div class="input-group">${controlHtml}
                        <button type="button" class="btn btn-outline-primary" id="viewDirectionsBtn" title="View directions on Google Maps">${ICON_MAP} Directions</button>
                    </div>`;
                }

                let helpHtml = '';
                if (field.helpText) {
                    const icon = field.directionsButton ? ICON_INFO + ' ' : '';
                    helpHtml = `<div class="help-text">${icon}${field.helpText}</div>`;
                } else if (field.type === 'textarea' && field.maxLength) {
                    helpHtml = `<div class="help-text">Maximum ${field.maxLength} characters. <span class="char-counter">0/${field.maxLength}</span></div>`;
                }

                // Checkbox already carries its own label inline (form-check-label above);
                // radio's label has no `for` since it applies to the whole group, not one input
                const labelHtml = field.type === 'checkbox'
                    ? ''
                    : field.type === 'radio'
                        ? `<label class="form-label">${field.label}${reqMark}</label>`
                        : `<label for="${key}" class="form-label">${field.label}${reqMark}</label>`;

                return `<div class="col-md-${field.col || 12} mb-3" data-field="${key}">
                    ${labelHtml}
                    ${controlHtml}
                    ${helpHtml}
                    <div class="invalid-feedback"></div>
                </div>`;
            }

            // Real lunch counts aren't known at submission time (permission slips/
            // headcounts firm up later), so this form only collects the Yes/No -
            // actual name entry happens later via the link in the confirmation email.
            // lunch_names stays customWidget (FORM_SCHEMA) since there's nothing to
            // render for it here at all anymore.
            function buildLunchMessageHtml() {
                return `<div class="col-md-12 mb-3" id="lunchMessageWrapper" style="display:none;">
                    <div class="alert alert-info mb-0">${ICON_INFO}
                        In your confirmation email, you will be provided a link to submit school lunch option counts.
                        The Food Services Department needs at least a week notice to guarantee orders can be processed.
                        Field trips with less than a week notice should contact food service directly.
                        If you lose the email, you can click on link at bottom of field trip form to check status of previous trips and access lunch count.
                        <br><br>${lunchCostText}
                    </div>
                </div>`;
            }

            function renderForm() {
                let html = '';

                SECTION_ORDER.forEach(function(sectionName) {
                    const keys = Object.keys(formFields).filter(function(k) {
                        return formFields[k].section === sectionName && !formFields[k].customWidget;
                    });
                    if (!keys.length) return;

                    html += `<div class="section-header"><h2>${SECTION_ICONS[sectionName]} ${sectionName}</h2></div>`;

                    let used = 0;
                    let rowHtml = '';

                    keys.forEach(function(key) {
                        const field = formFields[key];
                        const width = field.col || 12;

                        if (used + width > 12) {
                            html += `<div class="row">${rowHtml}</div>`;
                            rowHtml = '';
                            used = 0;
                        }

                        rowHtml += renderField(key, field);
                        used += width;
                    });

                    if (rowHtml) {
                        html += `<div class="row">${rowHtml}</div>`;
                    }

                    if (sectionName === 'Transportation Needs') {
                        html += TRANSPORTATION_NOTE_HTML;
                    }

                    if (sectionName === 'Schedule') {
                        html += `<div class="row">${buildLunchMessageHtml()}</div>`;
                    }
                });

                document.getElementById('formFields').innerHTML = html;
            }

            renderForm();

            // Pre-fill, not lock - prevents the common case of a typo'd email while
            // still letting someone submit under a different (e.g. personal) address
            if (userEmail) {
                const emailField = document.getElementById('email');
                if (emailField) emailField.value = userEmail;
            }

            const form = document.getElementById('fieldTripForm');
            const alertArea = document.getElementById('alertArea');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const inputs = form.querySelectorAll('input, select, textarea');

            // ---- School Provided Lunch: informational message only ----
            // Real name/count entry happens later via the link in the confirmation
            // email (see EmailService.js's sendSubmitterConfirmation) - this form
            // just shows the explanatory message when Yes is selected.
            const lunchMessageWrapper = document.getElementById('lunchMessageWrapper');

            function syncLunchMessageFromState() {
                const checkedRadio = form.querySelector('[name="school_lunch"]:checked');
                lunchMessageWrapper.style.display = (checkedRadio && checkedRadio.value === 'Yes') ? '' : 'none';
            }

            form.querySelectorAll('[name="school_lunch"]').forEach(function(radio) {
                radio.addEventListener('change', syncLunchMessageFromState);
            });

            inputs.forEach(function(input) {
                input.addEventListener('blur', function() {
                    validateField(this);
                });

                input.addEventListener('input', function() {
                    if (this.classList.contains('is-invalid')) {
                        validateField(this);
                    }
                });

                if (input.type === 'tel') {
                    input.addEventListener('input', function(e) {
                        let value = e.target.value.replace(/\D/g, '');
                        if (value.length > 10) value = value.substring(0, 10);

                        if (value.length >= 6) {
                            e.target.value = '(' + value.substring(0, 3) + ') ' + value.substring(3, 6) + '-' + value.substring(6);
                        } else if (value.length >= 3) {
                            e.target.value = '(' + value.substring(0, 3) + ') ' + value.substring(3);
                        } else if (value.length > 0) {
                            e.target.value = '(' + value;
                        }
                    });
                }

                if (input.tagName === 'TEXTAREA' && input.maxLength > 0) {
                    const wrapper = input.closest('[data-field]');
                    const counter = wrapper ? wrapper.querySelector('.char-counter') : null;
                    if (counter) {
                        input.addEventListener('input', function() {
                            counter.textContent = input.value.length + '/' + input.maxLength;
                        });
                    }
                }
            });

            // Re-check destination_address when depart_from changes, so the
            // address-matches-departure-school mistake is caught regardless of
            // which field the user filled in second
            const departFromField = form.querySelector('[name="depart_from"]');
            const destinationAddressField = form.querySelector('[name="destination_address"]');
            if (departFromField && destinationAddressField) {
                departFromField.addEventListener('change', function() {
                    if (destinationAddressField.value.trim()) {
                        validateField(destinationAddressField);
                    }
                });
            }

            function validateField(field) {
                const key = field.name;
                const schema = formFields[key];
                if (!schema) return true;

                const wrapper = field.closest('[data-field]');
                const feedbackEl = wrapper ? wrapper.querySelector('.invalid-feedback') : null;

                function markInvalid(message) {
                    field.classList.add('is-invalid');
                    field.classList.remove('is-valid');
                    if (feedbackEl) feedbackEl.textContent = message;
                }

                function markValid() {
                    field.classList.remove('is-invalid');
                    field.classList.add('is-valid');
                }

                if (schema.type === 'checkbox') {
                    // Optional and boolean - checked or not, there's nothing to validate
                    return true;
                }

                if (schema.type === 'radio') {
                    const checked = form.querySelector('input[name="' + key + '"]:checked');
                    if (schema.required && !checked) {
                        markInvalid('This field is required');
                        return false;
                    }
                    markValid();
                    return true;
                }

                const value = field.value.trim();

                if (schema.required && !value) {
                    markInvalid('This field is required');
                    return false;
                }

                if (!schema.required && !value) {
                    field.classList.remove('is-invalid', 'is-valid');
                    return true;
                }

                let isValid = true;
                let errorMessage = '';

                switch (schema.type) {
                    case 'email':
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                            isValid = false;
                            errorMessage = 'Please enter a valid email address';
                        }
                        break;

                    case 'tel':
                        if (value.replace(/\D/g, '').length !== 10) {
                            isValid = false;
                            errorMessage = 'Please enter a valid 10-digit phone number';
                        }
                        break;

                    case 'date':
                        if (schema.validate === 'futureDate') {
                            const selectedDate = new Date(value);
                            const today = new Date();
                            today.setHours(0, 0, 0, 0);
                            if (selectedDate < today) {
                                isValid = false;
                                errorMessage = 'Trip date must be in the future';
                            }
                        }
                        break;

                    case 'number':
                        const num = parseFloat(value);
                        if (isNaN(num)) {
                            isValid = false;
                            errorMessage = 'Please enter a valid number';
                        } else if (schema.min !== undefined && num < schema.min) {
                            isValid = false;
                            errorMessage = 'Value must be at least ' + schema.min;
                        } else if (schema.max !== undefined && num > schema.max) {
                            isValid = false;
                            errorMessage = 'Value must be at most ' + schema.max;
                        }
                        break;

                    case 'time':
                        const seqIndex = timeSequence.indexOf(key);
                        if (seqIndex > 0) {
                            const prevKey = timeSequence[seqIndex - 1];
                            const prevField = form.querySelector('[name="' + prevKey + '"]');
                            const prevValue = prevField ? prevField.value : '';
                            if (prevValue && value <= prevValue) {
                                isValid = false;
                                errorMessage = schema.label + ' must be after ' + formFields[prevKey].label.toLowerCase();
                            }
                        }
                        break;

                    case 'text':
                        if (key === 'destination_address') {
                            const departField = form.querySelector('[name="depart_from"]');
                            const departValue = departField ? departField.value : '';
                            const departAddress = departAddresses[departValue];
                            if (departAddress && normalizeAddress(value) === normalizeAddress(departAddress)) {
                                isValid = false;
                                errorMessage = 'This matches ' + departValue + '\'s own address - did you mean the destination\'s address?';
                            }
                        }
                        break;
                }

                if (isValid) {
                    markValid();
                } else {
                    markInvalid(errorMessage);
                }

                return isValid;
            }

            function validateForm() {
                let isValid = true;
                inputs.forEach(function(input) {
                    if (!validateField(input)) {
                        isValid = false;
                    }
                });
                return isValid;
            }

            function showAlert(message, type = 'danger') {
                alertArea.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${type === 'success' ? ICON_CHECK : ICON_INFO}
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                alertArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Highlights the specific fields a server-side validation error applies to,
            // reusing the same is-invalid / invalid-feedback markup as real-time validation
            function applyServerErrors(errors) {
                let firstWrapper = null;

                errors.forEach(function(err) {
                    const wrapper = form.querySelector('[data-field="' + err.field + '"]');
                    if (!wrapper) return;

                    const field = wrapper.querySelector('[name="' + err.field + '"]');
                    const feedbackEl = wrapper.querySelector('.invalid-feedback');

                    if (field) {
                        field.classList.add('is-invalid');
                        field.classList.remove('is-valid');
                    }
                    if (feedbackEl) feedbackEl.textContent = err.message;

                    if (!firstWrapper) firstWrapper = wrapper;
                });

                if (firstWrapper) {
                    firstWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function getFormData() {
                const data = {};
                inputs.forEach(function(input) {
                    if (!input.name) return;
                    if ((input.type === 'radio' || input.type === 'checkbox') && !input.checked) return;
                    data[input.name] = input.value;
                });
                return data;
            }

            function saveDraft() {
                const data = getFormData();
                localStorage.setItem('fieldTripDraft', JSON.stringify(data));
                showAlert('Draft saved successfully! You can return to this form later.', 'success');
            }

            function loadDraft() {
                const draft = localStorage.getItem('fieldTripDraft');
                if (!draft) return;

                try {
                    const data = JSON.parse(draft);
                    Object.keys(data).forEach(function(key) {
                        if (!data[key]) return;

                        const anyField = form.querySelector('[name="' + key + '"]');
                        if (!anyField) return;

                        if (anyField.type === 'radio') {
                            const radio = form.querySelector('[name="' + key + '"][value="' + data[key] + '"]');
                            if (radio) radio.checked = true;
                        } else if (anyField.type === 'checkbox') {
                            anyField.checked = true;
                        } else {
                            anyField.value = data[key];
                            if (anyField.tagName === 'SELECT') {
                                anyField.dispatchEvent(new Event('change'));
                            }
                        }
                    });
                    syncLunchMessageFromState();
                    showAlert('Previous draft loaded. Continue editing or submit when ready.', 'info');
                } catch (e) {
                    console.error('Error loading draft:', e);
                }
            }

            // Load draft on page load
            window.addEventListener('load', function() {
                if (localStorage.getItem('fieldTripDraft')) {
                    if (confirm('A saved draft was found. Would you like to load it?')) {
                        loadDraft();
                    }
                }
            });

            // Save draft button
            document.getElementById('saveDraftBtn').addEventListener('click', function() {
                saveDraft();
            });

            // Google Maps Directions button (only rendered for the field with directionsButton: true)
            const directionsBtn = document.getElementById('viewDirectionsBtn');
            if (directionsBtn) {
                directionsBtn.addEventListener('click', function() {
                    const departFrom = document.getElementById('depart_from').value;
                    const destinationAddress = document.getElementById('destination_address').value;

                    if (!departFrom) {
                        showAlert('Please select a departure location first.', 'warning');
                        document.getElementById('depart_from').focus();
                        return;
                    }

                    if (!destinationAddress) {
                        showAlert('Please enter a destination address first.', 'warning');
                        document.getElementById('destination_address').focus();
                        return;
                    }

                    const origin = encodeURIComponent(departFrom + ', Olmsted Falls, OH');
                    const destination = encodeURIComponent(destinationAddress);
                    const mapsUrl = 'https://www.google.com/maps/dir/?api=1&origin=' + origin + '&destination=' + destination + '&travelmode=driving';

                    window.open(mapsUrl, '_blank');
                });
            }

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                if (!validateForm()) {
                    showAlert('Please correct the errors in the form before submitting.', 'danger');
                    return;
                }

                const formData = getFormData();

                loadingOverlay.style.display = 'flex';

                google.script.run
                    .withSuccessHandler(function(response) {
                        loadingOverlay.style.display = 'none';

                        if (response.success) {
                            localStorage.removeItem('fieldTripDraft');

                            showAlert(
                                '<strong>Success!</strong> Your field trip application has been submitted. ' +
                                'You will receive a confirmation email shortly. Submission #' + response.submissionNumber,
                                'success'
                            );

                            form.reset();
                            inputs.forEach(function(input) {
                                input.classList.remove('is-valid', 'is-invalid');
                            });
                            lunchMessageWrapper.style.display = 'none';

                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } else {
                            showAlert(
                                '<strong>Error!</strong> ' + (response.message || 'An error occurred. Please try again.'),
                                'danger'
                            );

                            if (response.errors && response.errors.length) {
                                applyServerErrors(response.errors);
                            }
                        }
                    })
                    .withFailureHandler(function(error) {
                        loadingOverlay.style.display = 'none';
                        showAlert(
                            '<strong>Error!</strong> Failed to submit form. Please try again or contact support.',
                            'danger'
                        );
                        console.error('Submission error:', error);
                    })
                    .submitFieldTripForm(JSON.stringify(formData));
            });

        })();
    </script>
</body>
</html>
