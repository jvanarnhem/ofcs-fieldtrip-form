<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Lunch Counts - Field Trip Application</title>

    <!-- Bootstrap 5 CSS, vendored locally (no external CDN request) -->
    <?!= include('VendorStyles'); ?>

    <style>
        body {
            background: #4a5568;
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .lunch-entry-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .lunch-entry-header {
            background: linear-gradient(135deg, #000068 0%, #0d47a1 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .open-form-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .open-form-btn:hover {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }

        .lunch-entry-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .lunch-entry-body {
            padding: 40px;
        }

        .lunch-option-block {
            margin-bottom: 16px;
        }

        .lunch-option-count {
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 700px;">
        <div class="lunch-entry-container">
            <div class="lunch-entry-header">
                <a href="<?!= webAppUrl ?>" target="_blank" rel="noopener" class="open-form-btn">Open Form ↗</a>
                <h1>School Lunch Counts</h1>
                <p class="mb-0">Field Trip Application</p>
            </div>

            <div class="lunch-entry-body">
                <div id="alertArea"></div>
                <div id="mainArea"></div>
            </div>
        </div>
    </div>

    <!-- Only Bootstrap JS feature used on this page is alert dismissal, so a full bundle isn't vendored -->
    <script>
        document.addEventListener('click', function (e) {
            var dismissBtn = e.target.closest('[data-bs-dismiss="alert"]');
            if (dismissBtn) {
                var alertEl = dismissBtn.closest('.alert');
                if (alertEl) alertEl.remove();
            }
        });

        // info is null if the submission wasn't found; a mismatched-identity visitor
        // never reaches this page at all (CodeNew.js's doGet routes them to
        // NotAuthorized.html instead), so any info present here has already been
        // confirmed to belong to the signed-in visitor
        const info = <?!= JSON.stringify(info) ?>;
        const lunchOptions = <?!= JSON.stringify(lunchOptions) ?>;
        const webAppUrl = <?!= JSON.stringify(webAppUrl) ?>;
        const lunchCostText = <?!= JSON.stringify(lunchCostText) ?>;

        function showAlert(message, type) {
            var div = document.createElement('div');
            div.className = 'alert alert-' + type + ' alert-dismissible fade show';
            div.setAttribute('role', 'alert');
            div.textContent = message;

            var closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'btn-close';
            closeBtn.setAttribute('data-bs-dismiss', 'alert');
            div.appendChild(closeBtn);

            var area = document.getElementById('alertArea');
            area.innerHTML = '';
            area.appendChild(div);
        }

        // Same "---"-separated blob format used everywhere else this data is read/
        // written (FormNew.html originally, now LunchHandlers.js/EmailService.js) -
        // survives sanitizeInput's HTML-entity escaping since it only touches
        // & < > " ' /, never newlines or hyphens.
        function parseLunchNames(str) {
            const result = {};
            if (!str) return result;
            let current = null;
            str.split('\n').forEach(function(line) {
                if (line === '---') { current = null; return; }
                if (current === null) {
                    current = line;
                    result[current] = [];
                } else if (line.trim()) {
                    result[current].push(line.trim());
                }
            });
            return result;
        }

        function buildLunchNamesString(namesByOption) {
            const lines = [];
            lunchOptions.forEach(function(option, i) {
                if (i > 0) lines.push('---');
                lines.push(option.name);
                (namesByOption[option.name] || []).forEach(function(name) {
                    lines.push(name);
                });
            });
            return lines.join('\n');
        }

        function renderNotFound() {
            document.getElementById('mainArea').innerHTML =
                '<p class="lead">This lunch-counts link isn\'t valid.</p>' +
                '<p class="text-muted">Double check the link from your confirmation email, or use the ' +
                '<a href="' + webAppUrl + '?checkStatus=1" target="_top">status check page</a> instead.</p>';
        }

        function renderCancelled() {
            document.getElementById('mainArea').innerHTML =
                '<p class="lead">This trip has been cancelled - no lunch is needed.</p>' +
                '<p class="text-muted">' + (info.destination || '') + ' on ' +
                (info.trip_date ? new Date(info.trip_date).toLocaleDateString() : '') + '</p>';
        }

        // Once Food Services marks a request Done (Lunch Dashboard), it's locked from
        // further teacher-side edits - matches the server-side check in
        // LunchHandlers.js's submitLunchCounts, so this is just the friendlier
        // front-end mirror of that same rule, not the actual enforcement point.
        function renderLocked() {
            document.getElementById('mainArea').innerHTML =
                '<p class="text-muted">' + (info.destination || '') + ' &middot; ' +
                (info.trip_date ? new Date(info.trip_date).toLocaleDateString() : '') + ' &middot; ' + (info.building || '') + '</p>' +
                '<div class="alert alert-success">Your lunch counts have already been processed by Food Services.</div>' +
                '<p>If you need to make a change, please contact Food Services directly rather than resubmitting here.</p>' +
                (info.lunch_names ? '<div class="mt-3">' + formatLunchCountsSummary(info.lunch_names) + '</div>' : '');
        }

        function formatLunchCountsSummary(str) {
            const parsed = parseLunchNames(str);
            const optionNames = Object.keys(parsed);
            if (!optionNames.length) return '';
            return optionNames.map(function(name) {
                return '<div><strong>' + name + ':</strong> ' + parsed[name].join(', ') + '</div>';
            }).join('');
        }

        function renderEntryForm() {
            const area = document.getElementById('mainArea');

            let html = '<p class="text-muted">' + (info.destination || '') + ' &middot; ' +
                (info.trip_date ? new Date(info.trip_date).toLocaleDateString() : '') + ' &middot; ' + (info.building || '') + '</p>';

            html += '<div class="alert alert-info">The Food Services Department needs at least a week\'s notice to guarantee orders can be ' +
                'processed. Field trips with less than a week notice should contact food service directly.<br><br>' + lunchCostText + '</div>';

            if (info.lunch_status === 'Counts Provided') {
                html += '<div class="alert alert-success">Counts were already submitted for this trip - update them below if anything changed.</div>';
            }

            if (!lunchOptions.length) {
                html += '<div class="alert alert-warning">No lunch options have been configured yet. Contact an admin to set them up.</div>';
                area.innerHTML = html;
                return;
            }

            const existing = parseLunchNames(info.lunch_names);

            html += '<form id="lunchEntryForm">';
            lunchOptions.forEach(function(option, i) {
                html += '<div class="lunch-option-block">' +
                    '<label class="form-label mb-0" for="lunchOptionInput_' + i + '">' + option.name + '</label>' +
                    (option.description ? '<div class="lunch-option-desc text-muted small mb-1">' + option.description + '</div>' : '') +
                    '<textarea class="form-control" id="lunchOptionInput_' + i + '" rows="5" placeholder="One student name per line"></textarea>' +
                    '<div class="lunch-option-count" id="lunchOptionCount_' + i + '">0 students</div>' +
                    '</div>';
            });
            html += '<p class="text-muted small">You can update these counts anytime before Food Services processes your request. ' +
                'If you need to make a change after that, please contact Food Services directly.</p>';
            html += '<button type="submit" class="btn btn-submit btn-primary" id="submitLunchBtn">Submit Lunch Counts</button>';
            html += '</form>';

            area.innerHTML = html;

            lunchOptions.forEach(function(option, i) {
                const textarea = document.getElementById('lunchOptionInput_' + i);
                textarea.value = (existing[option.name] || []).join('\n');

                const updateCount = function() {
                    const count = textarea.value.split('\n').map(function(n) { return n.trim(); }).filter(Boolean).length;
                    document.getElementById('lunchOptionCount_' + i).textContent = count + ' student' + (count === 1 ? '' : 's');
                };
                textarea.addEventListener('input', updateCount);
                updateCount();
            });

            document.getElementById('lunchEntryForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const namesByOption = {};
                lunchOptions.forEach(function(option, i) {
                    const raw = document.getElementById('lunchOptionInput_' + i).value;
                    namesByOption[option.name] = raw.split('\n').map(function(n) { return n.trim(); }).filter(Boolean);
                });

                const lunchNamesValue = buildLunchNamesString(namesByOption);
                const btn = document.getElementById('submitLunchBtn');
                btn.disabled = true;
                btn.textContent = 'Submitting...';

                google.script.run
                    .withSuccessHandler(function(raw) {
                        btn.disabled = false;
                        btn.textContent = 'Submit Lunch Counts';

                        let response = null;
                        try { response = JSON.parse(raw); } catch (e) { response = null; }

                        if (!response || !response.success) {
                            showAlert((response && response.message) || 'Unable to submit lunch counts.', 'danger');
                            return;
                        }

                        showAlert('Lunch counts submitted - thank you!', 'success');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    })
                    .withFailureHandler(function(error) {
                        btn.disabled = false;
                        btn.textContent = 'Submit Lunch Counts';
                        console.error('submitLunchCounts failed:', error);
                        showAlert('Something went wrong submitting lunch counts. Please try again.', 'danger');
                    })
                    .submitLunchCounts(info.submission_number, lunchNamesValue);
            });
        }

        if (!info) {
            renderNotFound();
        } else if (info.status === 'Rejected') {
            renderCancelled();
        } else if (info.lunch_status === 'Completed') {
            renderLocked();
        } else {
            renderEntryForm();
        }
    </script>
</body>
</html>
